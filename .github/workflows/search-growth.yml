name: Search growth validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check restaurant image download budget
        run: node scripts/check-restaurant-image.mjs
  tenant-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies for persistence TypeScript tests
        run: npm ci --no-fund --no-audit
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix validation/tenant-database-tooling --no-save --package-lock=false --ignore-scripts --no-fund --no-audit @electric-sql/pglite@0.5.16
      - name: Test tenant policies and evidence constraints in isolation
        run: npm run check:database
  validate:
    # Pin the supported runner for the existing Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VERCEL_ENV: production
      NEXT_PUBLIC_VERCEL_ENV: production
      NEXT_PUBLIC_ANALYTICS_EVENTS: 'false'
      RESEND_API_KEY: re_build_validation_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        # Validate and install the synchronized lockfile without dependency drift.
        run: npm ci --no-fund --no-audit
      - name: Validate retainer pricing consistency
        run: node scripts/check-retainer-pricing.mjs
      - name: Validate content, routes and draft exclusions
        run: node scripts/check-search-content.mjs
      - name: Test contact validation and success events without sending email
        run: node scripts/check-contact.mjs
      - name: Validate platform contracts and privacy boundary
        run: npm run check:platform
      - name: Validate portal rendering and disclosure contracts
        run: node components/platform/portal-render.test.cjs
      - name: Validate Supabase auth and offline readiness contracts
        run: npm run check:supabase
      - name: Validate shared UI stores
        run: npm run check:ui
      - name: Lint implementation files
        run: npx eslint app components/AEOLanding.tsx components/Hero.tsx components/Contact.tsx components/ReceptionistEnquiry.tsx components/ContentPage.tsx components/SiteAnalytics.tsx components/Header.tsx components/Footer.tsx components/FAQ.tsx lib/site.ts lib/receptionist.ts lib/content.ts lib/analytics.ts
      - name: Require full repository lint
        id: lint
        run: |
          mkdir -p validation
          set -o pipefail
          npm run lint 2>&1 | tee validation/full-repository-lint.txt
      - name: Independent TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build -- --webpack
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check routes, SEO, AEO enquiries and responsive layouts
        run: |
          npm run start > /tmp/picshaw-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 2
          done
          node scripts/check-search-preview.mjs
          node scripts/check-receptionist-preview.mjs
          node scripts/check-privacy.mjs
          node scripts/check-platform-http.mjs
          node scripts/check-seo-audit.mjs
      - name: Verify SEO fixes on the published site
        if: github.ref == 'refs/heads/main'
        env:
          PREVIEW_URL: https://www.picshaw.com
          SEO_AUDIT_REPORT: production-seo-audit.json
        run: node scripts/check-seo-audit.mjs
      - name: Record separate lint outcome
        if: always()
        run: |
          echo 'Full repository lint: ${{ steps.lint.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full repository lint and TypeScript are required launch checks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picshaw-search-growth-validation
          path: validation/
          retention-days: 14
