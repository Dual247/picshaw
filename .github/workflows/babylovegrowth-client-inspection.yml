name: Inspect BabyLoveGrowth read client
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/babylovegrowth-client-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect published package source without credentials
        run: |
          mkdir -p /tmp/blg-client && cd /tmp/blg-client
          npm view babylovegrowth-next-js-blog version repository dist --json
          npm pack babylovegrowth-next-js-blog@0.2.4 --ignore-scripts
          tar -xzf babylovegrowth-next-js-blog-0.2.4.tgz
          cat package/package.json
          find package -maxdepth 3 -type f | sort
          find package -path '*/node_modules' -prune -o -type f \( -name '*.d.ts' -o -path '*/dist/*.js' -o -path '*/src/*.ts' \) -exec sh -c 'echo "SOURCE: $1"; cat "$1"' sh {} \;
          npm view sanitize-html version dist --json
          npm view '@types/sanitize-html' version --json
