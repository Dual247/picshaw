name: BabyLoveGrowth integration validation
on:
  pull_request:
    branches: [main]
    paths: ['app/blog/**', 'app/sitemap.ts', 'app/api/blog/**', 'lib/blog*', 'lib/babylovegrowth*', 'scripts/check-babylovegrowth*', 'package.json', 'package-lock.json', 'pnpm-lock.yaml', '.github/workflows/babylovegrowth.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RESEND_API_KEY: re_build_validation_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Lint integration files
        run: npx eslint app/blog app/sitemap.ts app/api/blog lib/blog.ts lib/blog-model.ts lib/babylovegrowth-client.ts
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Unit and client tests
        run: node scripts/check-babylovegrowth.mjs
      - name: Install browser runner without changing locks
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify dynamic publication in one production build
        run: |
          export TESTED_COMMIT=$(git rev-parse HEAD)
          node scripts/check-babylovegrowth-integration.mjs
      - name: Save preview and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picshaw-babylovegrowth-preview
          path: validation/babylovegrowth*
          retention-days: 14
