name: Render receptionist explainer assets
on:
  push:
    branches: [feat/receptionist-explainer-pricing]
    paths:
      - 'scripts/render-receptionist-explainer.py'
      - '.github/workflows/render-receptionist-media.yml'
permissions:
  contents: write
concurrency:
  group: receptionist-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/receptionist-explainer-pricing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          python -m pip install Pillow==12.3.0
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then sudo apt-get update && sudo apt-get install -y fonts-dejavu-core; fi
      - name: Render original silent explainer
        run: python scripts/render-receptionist-explainer.py
      - name: Commit only the three generated media assets to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/receptionist-walkthrough.mp4 public/media/receptionist-poster.jpg public/media/receptionist-walkthrough.vtt
          if ! git diff --cached --quiet; then
            git commit -m 'Add rendered receptionist walkthrough video and accessible media assets'
            git push origin HEAD:feat/receptionist-explainer-pricing
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: receptionist-explainer-media
          path: public/media/receptionist-*
          retention-days: 14
